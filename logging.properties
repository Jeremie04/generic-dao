# Active l'affichage du SQL et des evenements de cycle de vie (commit, connexion fermee, ...)
# generes par GenericDAO, qui sont au niveau FINE (equivalent DEBUG) et donc masques par
# defaut. A utiliser avec : java -Djava.util.logging.config.file=logging.properties ...
handlers=java.util.logging.ConsoleHandler
.level=INFO

Generic.dao.level=FINE
Generic.connexion.level=FINE

java.util.logging.ConsoleHandler.level=FINE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%4$s: %5$s%n
